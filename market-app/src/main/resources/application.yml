spring:
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marketdb}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  security:
    oauth2:
      client:
        registration:
          payment-client:
            provider: keycloak
            client-id: payment-client
            client-secret: payment-client-secret
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/market-realm
cache:
  ttl: PT1M

payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8081/api/v1}

logging:
  level:
    co.kremnev: DEBUG
